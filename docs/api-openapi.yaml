openapi: 3.0.3
info:
  title: AKWABA API — Rencontres Côte d'Ivoire & Diaspora
  version: 1.0.0
  description: |
    API REST v1 & WebSocket partagée entre l'application Web/PWA AKWABA et les futures applications mobiles Flutter (iOS & Android).
    Intègre la gestion des paiements Mobile Money & Cartes via GeniusPay.
servers:
  - url: http://localhost:3000/api/v1
    description: Serveur de développement local
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminSecret:
      type: apiKey
      in: header
      name: X-Admin-Secret
paths:
  /public-config:
    get:
      summary: Capacités publiques du serveur (mode démo, simulateur paiement, canaux OTP/Email actifs)
      responses:
        '200':
          description: Configuration publique sûre
  /health:
    get:
      summary: Vérifier l'état de l'API, GeniusPay, WhatsApp OTP et Gemini Vision
      responses:
        '200':
          description: Service opérationnel
  /auth/register:
    post:
      summary: Créer un compte (18+) avec bonus de bienvenue et parrainage
      responses:
        '201':
          description: Compte créé et JWT retourné
  /auth/login:
    post:
      summary: Connexion par email et mot de passe
      responses:
        '200':
          description: Authentification réussie
  /auth/demo:
    post:
      summary: Accès démo instantané (Kouamé ou Aya)
      responses:
        '200':
          description: JWT démo retourné
  /auth/ws-ticket:
    post:
      security:
        - BearerAuth: []
      summary: Générer un ticket WebSocket éphémère à usage unique (30s) pour éviter le JWT dans l'URL
      responses:
        '200':
          description: Ticket WebSocket retourné
  /auth/password-reset/request:
    post:
      summary: Demander un code à 6 chiffres pour réinitialiser son mot de passe (WhatsApp prioritaire ou Email)
      responses:
        '200':
          description: Demande traitée
        '429':
          description: Cooldown actif
  /auth/password-reset/confirm:
    post:
      summary: Valider le code à 6 chiffres et définir un nouveau mot de passe
      responses:
        '200':
          description: Mot de passe mis à jour
  /auth/change-password:
    post:
      security:
        - BearerAuth: []
      summary: Changer son mot de passe depuis Mon Profil
      responses:
        '200':
          description: Mot de passe modifié
  /auth/me:
    get:
      security:
        - BearerAuth: []
      summary: Profil connecté, solde Cauris, abonnement et métadonnées (communes, quiz Vrai Babi)
      responses:
        '200':
          description: Session courante
    delete:
      security:
        - BearerAuth: []
      summary: Supprimer définitivement son compte et purger ses fichiers sur disque (ARTCI / RGPD)
      responses:
        '200':
          description: Compte et médias supprimés
  /auth/phone-otp/request:
    post:
      security:
        - BearerAuth: []
      summary: Envoyer un code OTP 6 chiffres par WhatsApp Cloud API (ou simulateur local dev)
      responses:
        '200':
          description: Code OTP envoyé (avec cooldown anti-abus)
        '429':
          description: Cooldown actif avant renvoi
  /auth/phone-otp/verify:
    post:
      security:
        - BearerAuth: []
      summary: Valider le code OTP WhatsApp 6 chiffres et activer le badge téléphone (+15 confiance)
      responses:
        '200':
          description: Numéro vérifié
        '422':
          description: Code OTP invalide
  /auth/phone-verify:
    post:
      security:
        - BearerAuth: []
      summary: Alias rétrocompatible de /auth/phone-otp/verify (exige désormais un code OTP 6 chiffres valide)
      responses:
        '200':
          description: Numéro vérifié
        '422':
          description: Code OTP manquant ou invalide
  /profiles/discover:
    get:
      security:
        - BearerAuth: []
      summary: Découvrir des profils triés par Boost + Alchimie Culturelle Vrai Babi
      parameters:
        - in: query
          name: commune
          schema:
            type: string
        - in: query
          name: intention
          schema:
            type: string
        - in: query
          name: verifiedOnly
          schema:
            type: boolean
        - in: query
          name: diasporaOnly
          schema:
            type: boolean
        - in: query
          name: onlineOnly
          schema:
            type: boolean
      responses:
        '200':
          description: Liste des profils compatibles
  /profiles/tonight:
    get:
      security:
        - BearerAuth: []
      summary: Radar des membres disponibles ce soir
      responses:
        '200':
          description: Liste des profils disponibles ce soir
  /profiles/me:
    put:
      security:
        - BearerAuth: []
      summary: Mettre à jour son profil, ses tags et son quiz Vrai Babi
      responses:
        '200':
          description: Profil mis à jour
  /profiles/me/voice:
    post:
      security:
        - BearerAuth: []
      summary: Enregistrer une note vocale de présentation (base64 audio)
      responses:
        '200':
          description: Note vocale enregistrée
  /profiles/me/avatar:
    post:
      security:
        - BearerAuth: []
      summary: Uploader une photo de profil locale (JPEG, PNG, WebP base64 avec validation magic-bytes)
      responses:
        '200':
          description: Photo de profil mise à jour
        '422':
          description: Format image invalide
  /profiles/me/passport:
    post:
      security:
        - BearerAuth: []
      summary: Activer le Passeport Babi (retour au pays / autre ville)
      responses:
        '200':
          description: Passeport Babi mis à jour
  /profiles/me/incognito:
    post:
      security:
        - BearerAuth: []
      summary: Activer ou désactiver le Mode Incognito
      responses:
        '200':
          description: Statut incognito mis à jour
  /profiles/me/boost:
    post:
      security:
        - BearerAuth: []
      summary: Activer le Boost Tête d'affiche 24h (150 Cauris)
      responses:
        '200':
          description: Boost activé
  /swipes:
    post:
      security:
        - BearerAuth: []
      summary: Enregistrer une action pass, like ou super_like (avec reactionNote optionnel) et détecter un match mutuel
      responses:
        '200':
          description: Action enregistrée (inclut breakdown d'alchimie et trustBreakdown)
  /swipes/rewind:
    post:
      security:
        - BearerAuth: []
      summary: Revenir sur le dernier profil passé
      responses:
        '200':
          description: Profil restauré
  /matches:
    get:
      security:
        - BearerAuth: []
      summary: Lister les matchs mutuels
      responses:
        '200':
          description: Liste des matchs
  /likes/received:
    get:
      security:
        - BearerAuth: []
      summary: Lister les admirateurs (floutés si compte gratuit non révélé)
      responses:
        '200':
          description: Liste des admirateurs
  /likes/{userId}/reveal:
    post:
      security:
        - BearerAuth: []
      summary: Débloquer l'identité d'un admirateur (120 Cauris)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Admirateur révélé
  /chats/{matchId}/messages:
    get:
      security:
        - BearerAuth: []
      summary: Récupérer l'historique d'une conversation
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Liste des messages
    post:
      security:
        - BearerAuth: []
      summary: Envoyer un message texte avec inspection Bouclier Babi
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Message envoyé
  /chats/direct:
    post:
      security:
        - BearerAuth: []
      summary: Envoyer un DM direct avant match (100 Cauris, réponse gratuite)
      responses:
        '201':
          description: Conversation ouverte et DM envoyé
  /chats/{matchId}/voice:
    post:
      security:
        - BearerAuth: []
      summary: Envoyer une note vocale dans une conversation
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Vocal envoyé
  /chats/{matchId}/gift:
    post:
      security:
        - BearerAuth: []
      summary: Offrir un cadeau culturel ivoirien en Cauris
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Cadeau envoyé
  /chats/{matchId}/date-invite:
    post:
      security:
        - BearerAuth: []
      summary: Proposer un rendez-vous dans un lieu Safe Date vérifié (avec créneau et message)
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Invitation envoyée
  /chats/{matchId}/messages/{messageId}/respond-date:
    post:
      security:
        - BearerAuth: []
      summary: Accepter ou décliner une invitation Safe Date dans le Salon Privé
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: string
        - in: path
          name: messageId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Statut de l'invitation mis à jour et confirmation postée
  /safety/challenge:
    get:
      security:
        - BearerAuth: []
      summary: Obtenir le défi selfie gestuel du jour, le statut de vérification et le détail du score de confiance
      responses:
        '200':
          description: Défi, dernière soumission et métriques
  /safety/verify-selfie:
    post:
      security:
        - BearerAuth: []
      summary: Soumettre une vraie photo selfie (JPEG/PNG/WebP base64) pour analyse Gemini Vision ou file manuelle
      responses:
        '200':
          description: Résultat de soumission (verified, pending_review ou rejected)
        '422':
          description: Image invalide ou payload factice rejeté
  /safety/admin/verifications:
    get:
      security:
        - AdminSecret: []
      summary: Lister la file de modération Selfie 225 (filtrable par status)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending_review, verified, rejected, all]
      responses:
        '200':
          description: File des demandes de vérification
        '401':
          description: Secret X-Admin-Secret invalide
  /safety/admin/verifications/{id}/image:
    get:
      security:
        - AdminSecret: []
      summary: Télécharger le cliché selfie privé stocké hors public/ (Cache-Control no-store)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flux binaire de l'image selfie
        '404':
          description: Image introuvable
  /safety/admin/verifications/{id}/review:
    post:
      security:
        - AdminSecret: []
      summary: Approuver ou refuser une demande Selfie 225 et notifier le membre en temps réel via WebSocket
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Décision enregistrée et score de confiance recalculé
  /safety/admin/reports:
    get:
      security:
        - AdminSecret: []
      summary: Lister les signalements membres dans la console /admin
      responses:
        '200':
          description: Liste des signalements
  /safety/admin/users/{id}:
    delete:
      security:
        - AdminSecret: []
      summary: Bannir et purger définitivement un compte frauduleux et ses fichiers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compte purgé
  /safety/admin/purge-demo:
    post:
      security:
        - AdminSecret: []
      summary: Purger tous les comptes démo (@akwaba.ci) avant la mise en production publique
      responses:
        '200':
          description: Comptes démo et données associées purgés
  /safety/report:
    post:
      security:
        - BearerAuth: []
      summary: Signaler et bloquer un profil suspect
      responses:
        '200':
          description: Signalement enregistré
  /store/catalog:
    get:
      summary: Catalogue des Pass XOF, Packs Cauris, Cadeaux et Moyens GeniusPay
      responses:
        '200':
          description: Catalogue complet
  /wallet:
    get:
      security:
        - BearerAuth: []
      summary: Solde de Cauris, historique des transactions et commandes GeniusPay
      responses:
        '200':
          description: Portefeuille utilisateur
  /wallet/daily-checkin:
    post:
      security:
        - BearerAuth: []
      summary: Réclamer le bonus quotidien de Cauris
      responses:
        '200':
          description: Bonus crédité
  /payments/checkout:
    post:
      security:
        - BearerAuth: []
      summary: Initier un paiement GeniusPay (Wave, Orange Money, MTN MoMo, Moov, Carte)
      responses:
        '201':
          description: Session checkout créée avec référence MTX-...
  /payments/{reference}/status:
    get:
      security:
        - BearerAuth: []
      summary: Vérifier l'état d'une transaction GeniusPay
      parameters:
        - in: path
          name: reference
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Statut de la transaction
  /webhooks/geniuspay:
    post:
      summary: Récepteur Webhook GeniusPay vérifié par signature HMAC-SHA256
      responses:
        '200':
          description: Événement traité de manière idempotente
  /dates/spots:
    get:
      security:
        - BearerAuth: []
      summary: Lister les lieux Safe Date et événements à Abidjan & Assinie
      responses:
        '200':
          description: Liste des lieux et réservations
  /dates/bookings:
    post:
      security:
        - BearerAuth: []
      summary: Réserver un billet Safe Date payable par GeniusPay (Web & Mobile)
      responses:
        '201':
          description: Réservation initiée
